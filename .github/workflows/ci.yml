name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit + differential tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: make test
        run: make test

  smoke:
    name: Build + run synthetic ROM (GPL-free)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update -q && sudo apt-get install -y -q libsdl2-dev
      - name: tools/ci_smoke.sh
        run: tools/ci_smoke.sh
